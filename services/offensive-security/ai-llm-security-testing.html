<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI & LLM Security Testing</title>
    <meta
      name="description"
      content="Test AI and LLM systems for prompt injection, data leakage, and abuse."
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <div data-include="/partials/header.html"></div>

    <section class="hero soc-hero">
      <div class="soc-hero-inner">
        <h1>AI & LLM Security Testing</h1>
        <p>Secure your AI systems against emerging threats.</p>
        <a href="#contact" class="cta-btn">Test AI Security</a>
      </div>
    </section>

    <section class="section">
      <h1 class="section-title">AI-Specific Threats We Test</h1>
      <div class="services">
        <div class="service-card">
          <h2>Prompt Injection</h2>
          <p>Malicious prompt manipulation.</p>
        </div>
        <div class="service-card">
          <h2>Model Abuse</h2>
          <p>Unauthorized use and data leakage.</p>
        </div>
        <div class="service-card">
          <h2>AI Governance</h2>
          <p>Policy and compliance validation.</p>
        </div>
      </div>
    </section>

    <section class="section" id="contact">
      <h1 class="section-title">Secure Your AI Systems</h1>
      <div class="contact-form-container">
        <form class="contact-form">
          <input type="text" placeholder="Full Name" required />
          <input type="text" placeholder="Company Name" required />
          <input type="email" placeholder="Work Email" required />
          <textarea placeholder="Describe your AI use case"></textarea>
          <button type="submit">Request Assessment</button>
        </form>
      </div>
    </section>

    <div data-include="/partials/footer.html"></div>
    <script src="/js/include.js"></script>
  </body>
</html>
